<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
<title>Keep count without it taking over.</title>
<defs>
<clipPath id="slide-clip"><rect width="1080" height="1350" fill="#fff"/></clipPath>
</defs>
<rect id="background" width="1080" height="1350" fill="#e3f7e8"/>
<g id="slide-content" clip-path="url(#slide-clip)">
<text id="eyebrow" fill="#248a3d" font-family="Inter" font-size="26" font-weight="600" letter-spacing="0.14em" xml:space="preserve"><tspan x="96" y="140">MINDFUL, NOT METICULOUS</tspan></text><text id="headline" fill="#0a0a0a" font-family="Inter Tight" font-size="112" font-weight="600" letter-spacing="-0.04em" xml:space="preserve"><tspan x="96" y="280">Keep count</tspan><tspan x="96" y="390">without it</tspan><tspan x="96" y="500">taking over.</tspan></text><text id="body" fill="#4d5a50" font-family="Inter" font-size="32" font-weight="400" xml:space="preserve"><tspan x="96" y="570">Macro asks for a rough number, not every gram,</tspan><tspan x="96" y="614">and looks at your week rather than every bite.</tspan></text><g id="principles"><g id="nothing-to-weigh"><rect x="96" y="676" width="456" height="126" rx="30" fill="#fff"/><circle cx="146" cy="739" r="24" fill="#34c759"/><path d="M136 739.4l6.6 6.6L156 732" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text fill="#0a0a0a" font-family="Inter" font-size="32" font-weight="500" letter-spacing="-0.01em" xml:space="preserve"><tspan x="192" y="750.52">Nothing to weigh</tspan></text></g><g id="a-bit-over-still-counts"><rect x="96" y="822" width="456" height="126" rx="30" fill="#fff"/><circle cx="146" cy="885" r="24" fill="#34c759"/><path d="M136 885.4l6.6 6.6L156 878" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text fill="#0a0a0a" font-family="Inter" font-size="32" font-weight="500" letter-spacing="-0.01em" xml:space="preserve"><tspan x="192" y="896.52">A bit over still counts</tspan></text></g><g id="we-do-the-maths"><rect x="96" y="968" width="456" height="126" rx="30" fill="#fff"/><circle cx="146" cy="1031" r="24" fill="#34c759"/><path d="M136 1031.4l6.6 6.6L156 1024" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text fill="#0a0a0a" font-family="Inter" font-size="32" font-weight="500" letter-spacing="-0.01em" xml:space="preserve"><tspan x="192" y="1042.52">We do the maths</tspan></text></g><g id="stays-on-your-iphone"><rect x="96" y="1114" width="456" height="126" rx="30" fill="#fff"/><circle cx="146" cy="1177" r="24" fill="#34c759"/><path d="M136 1177.4l6.6 6.6L156 1170" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text fill="#0a0a0a" font-family="Inter" font-size="32" font-weight="500" letter-spacing="-0.01em" xml:space="preserve"><tspan x="192" y="1188.52">Stays on your iPhone</tspan></text></g></g><g id="week-card"><rect x="572" y="676" width="412" height="564" rx="40" fill="#fff"/><rect x="598" y="702" width="360" height="132" rx="22" fill="#34c759" fill-opacity="0.12"/><g id="on-track"><rect x="620" y="724" width="128.46" height="40" rx="20" fill="#34c759" fill-opacity="0.16"/><text fill="#34c759" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.01em" xml:space="preserve"><tspan x="636" y="752">On track</tspan></text></g><text id="verdict" fill="#6e6e73" font-family="Inter" font-size="22" font-weight="400" letter-spacing="-0.01em" xml:space="preserve"><tspan x="620" y="794">5 of 6 days this week</tspan><tspan x="620" y="822">hit both goals</tspan></text><g id="week-chart"><line x1="650" x2="958" y1="1180" y2="1180" stroke="#e5e5ea" stroke-width="1.5"/><text fill="#8a8a8e" font-family="Inter" font-size="17" font-weight="400" xml:space="preserve"><tspan x="629.28" y="1186">0</tspan></text><line x1="650" x2="958" y1="1068.57" y2="1068.57" stroke="#e5e5ea" stroke-width="1.5"/><text fill="#8a8a8e" font-family="Inter" font-size="17" font-weight="400" xml:space="preserve"><tspan x="596.45" y="1074.57">1,000</tspan></text><line x1="650" x2="958" y1="957.14" y2="957.14" stroke="#e5e5ea" stroke-width="1.5"/><text fill="#8a8a8e" font-family="Inter" font-size="17" font-weight="400" xml:space="preserve"><tspan x="592.99" y="963.14">2,000</tspan></text><rect x="650" y="910.34" width="308" height="49.03" fill="#34c759" fill-opacity="0.12"/><path d="M657.48 1180V941.09Q657.48 937.09 661.48 937.09H682.52Q686.52 937.09 686.52 941.09V1180Z" fill="#34c759"/><text fill="#8a8a8e" font-family="Inter" font-size="17" font-weight="400" xml:space="preserve"><tspan x="654.2" y="1206">Mon</tspan></text><path d="M701.48 1180V955.57Q701.48 951.57 705.48 951.57H726.52Q730.52 951.57 730.52 955.57V1180Z" fill="#34c759"/><text fill="#8a8a8e" font-family="Inter" font-size="17" font-weight="400" xml:space="preserve"><tspan x="701.16" y="1206">Tue</tspan></text><path d="M745.48 1180V898.74Q745.48 894.74 749.48 894.74H770.52Q774.52 894.74 774.52 898.74V1180Z" fill="#f2a144"/><text fill="#8a8a8e" font-family="Inter" font-size="17" font-weight="400" xml:space="preserve"><tspan x="741.9" y="1206">Wed</tspan></text><path d="M789.48 1180V934.4Q789.48 930.4 793.48 930.4H814.52Q818.52 930.4 818.52 934.4V1180Z" fill="#34c759"/><text fill="#8a8a8e" font-family="Inter" font-size="17" font-weight="400" xml:space="preserve"><tspan x="788.46" y="1206">Thu</tspan></text><path d="M833.48 1180V947.77Q833.48 943.77 837.48 943.77H858.52Q862.52 943.77 862.52 947.77V1180Z" fill="#34c759"/><text fill="#8a8a8e" font-family="Inter" font-size="17" font-weight="400" xml:space="preserve"><tspan x="837.84" y="1206">Fri</tspan></text><path d="M877.48 1180V926.6Q877.48 922.6 881.48 922.6H902.52Q906.52 922.6 906.52 926.6V1180Z" fill="#34c759"/><text fill="#8a8a8e" font-family="Inter" font-size="17" font-weight="400" xml:space="preserve"><tspan x="878.99" y="1206">Sat</tspan></text><text fill="#8a8a8e" font-family="Inter" font-size="17" font-weight="400" xml:space="preserve"><tspan x="920.5" y="1206">Sun</tspan></text><line x1="650" x2="958" y1="934.86" y2="934.86" stroke="#5aa9ff" stroke-width="2" stroke-dasharray="6 5"/></g></g>
