<title>Roughly right every day beats perfectly right for a week.</title>
<rect id="background" width="1080" height="1350" fill="#f2f2f7"/><text id="wordmark" fill="#0a0a0a" font-family="Inter Tight" font-size="48" font-weight="600" letter-spacing="-0.035em" xml:space="preserve"><tspan x="96" y="172">Macro</tspan></text><text id="headline" fill="#0a0a0a" font-family="Inter Tight" font-size="135" font-weight="600" letter-spacing="-0.04em" xml:space="preserve"><tspan x="96" y="428.15">Roughly right</tspan><tspan x="96" y="560.44">every day</tspan><tspan x="638.54" y="560.44" fill="#a1a1a6"> beats</tspan><tspan x="96" y="692.75" fill="#a1a1a6">perfectly right</tspan><tspan x="96" y="825.05" fill="#a1a1a6">for a week.</tspan></text><text id="subhead" fill="#6e6e73" font-family="Inter" font-size="38" font-weight="400" xml:space="preserve"><tspan x="96" y="945.05">The calorie and protein tracker</tspan><tspan x="96" y="999.01">for being mindful, not meticulous.</tspan></text><g id="swipe"><rect x="776.02" y="1170" width="207.98" height="84" rx="42" fill="#fff"/><text fill="#0a0a0a" font-family="Inter" font-size="30" font-weight="500" xml:space="preserve"><tspan x="816.02" y="1222.5">Swipe</tspan></text><path d="M923.63 1212h18.75M934.88 1204.5l7.5 7.5 -7.5 7.5" stroke="#0a0a0a" stroke-width="3.38" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
