<text id="eyebrow" fill="#6e6e73" font-family="Inter" font-size="26" font-weight="600" letter-spacing="0.14em" xml:space="preserve"><tspan x="96" y="140">A TYPICAL TRACKER</tspan></text><text id="headline" fill="#0a0a0a" font-family="Inter Tight" font-size="180" font-weight="600" letter-spacing="-0.04em" xml:space="preserve"><tspan x="90" y="320.86">14 steps.</tspan></text><text id="body" fill="#6e6e73" font-family="Inter" font-size="36" font-weight="400" xml:space="preserve"><tspan x="96" y="398.86">One homemade spag bol for four,</tspan><tspan x="96" y="448.86">logged ingredient by ingredient.</tspan></text><g id="steps"><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="119.21" y="568.86">1</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="568.86">Tap “Create recipe”</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="113.98" y="612.86">2</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="612.86">Search “beef mince”</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="113.7" y="656.86">3</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="656.86">Pick the right match</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="112.94" y="700.86">4</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="700.86">Enter 500 g</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="113.93" y="744.86">5</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="744.86">Search “onion”</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="113.62" y="788.86">6</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="788.86">Choose a size</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="115.15" y="832.86">7</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="832.86">Search “chopped tomatoes”</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="113.64" y="876.86">8</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="876.86">Pick the closest match</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="113.62" y="920.86">9</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="920.86">Enter 400 g</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="102.43" y="964.86">10</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="964.86">Search “spaghetti”</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="108.42" y="1008.86">11</tspan></text><text fill="#3a3a3c" font-family="Inter" font-size="26" font-weight="400" xml:space="preserve"><tspan x="148" y="1008.86">Dry or cooked? Pick one</tspan></text><text fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="500" xml:space="preserve"><tspan x="103.19" y="1052.86">12</tspan>