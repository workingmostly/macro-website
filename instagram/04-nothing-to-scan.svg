<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
<title>Nothing to scan, search, weigh or snap.</title>
<rect id="background" width="1080" height="1350" fill="#f2f2f7"/><text id="eyebrow" fill="#a1a1a6" font-family="Inter" font-size="26" font-weight="600" letter-spacing="0.14em" xml:space="preserve"><tspan x="96" y="150">LEFT OUT ON PURPOSE</tspan></text><text id="headline" fill="#0a0a0a" font-family="Inter Tight" font-size="124" font-weight="600" letter-spacing="-0.04em" xml:space="preserve"><tspan x="96" y="304.15">Nothing to scan,</tspan><tspan x="96" y="425.67">search, weigh</tspan><tspan x="96" y="547.19">or snap.</tspan></text><g id="left-out"><g id="barcode-scanning"><text fill="#acacb0" font-family="Inter Tight" font-size="60" font-weight="500" letter-spacing="-0.03em" xml:space="preserve"><tspan x="96" y="762.19">Barcode scanning</tspan></text><rect x="90" y="741.49" width="458.53" height="5.4" rx="2.7" fill="#acacb0" id="strike"/></g><g id="food-photos"><text fill="#acacb0" font-family="Inter Tight" font-size="60" font-weight="500" letter-spacing="-0.03em" xml:space="preserve"><tspan x="594.53" y="762.19">Food photos</tspan></text><rect x="588.53" y="741.49" width="323.59" height="5.4" rx="2.7" fill="#acacb0" id="strike-2"/></g><g id="food-databases"><text fill="#acacb0" font-family="Inter Tight" font-size="60" font-weight="500" letter-spacing="-0.03em" xml:space="preserve"><tspan x="96" y="854.19">Food databases</tspan></text><rect x="90" y="833.49" width="409.42" height="5.4" rx="2.7" fill="#acacb0" id="strike-3"/></g><g id="kitchen-scales"><text fill="#acacb0" font-family="Inter Tight" font-size="60" font-weight="500" letter-spacing="-0.03em" xml:space="preserve"><tspan x="545.42" y="854.19">Kitchen scales</tspan></text><rect x="539.42" y="833.49" width="372.1" height="5.4" rx="2.7" fill="#acacb0" id="strike-4"/></g><g id="serving-sizes"><text fill="#acacb0" font-family="Inter Tight" font-size="60" font-weight="500" letter-spacing="-0.03em" xml:space="preserve"><tspan x="96" y="946.19">Serving sizes</tspan></text><rect x="90" y="925.49" width="339.5" height="5.4" rx="2.7" fill="#acacb0" id="strike-5"/></g><g id="ingredient-lists"><text fill="#acacb0" font-family="Inter Tight" font-size="60" font-weight="500" letter-spacing="-0.03em" xml:space="preserve"><tspan x="475.5" y="946.19">Ingredient lists</tspan></text><rect x="469.5" y="925.49" width="367.67" height="5.4" rx="2.7" fill="#acacb0" id="strike-6"/></g></g><text id="body" fill="#6e6e73" font-family="Inter" font-size="38" font-weight="400" xml:space="preserve"><tspan x="96" y="1130.08">Measuring every bite turns food into</tspan><tspan x="96" y="1184.04">homework. Macro leaves it all out, so there’s</tspan><tspan x="96" y="1238">nothing to look up and nothing to get wrong.</tspan></text>
</svg>
