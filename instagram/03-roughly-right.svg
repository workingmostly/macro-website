<text id="eyebrow" fill="#ff9500" font-family="Inter" font-size="26" font-weight="600" letter-spacing="0.14em" xml:space="preserve"><tspan x="96" y="140">WHY IT WORKS</tspan></text><text id="headline" fill="#0a0a0a" font-family="Inter Tight" font-size="88" font-weight="600" letter-spacing="-0.04em" xml:space="preserve"><tspan x="96" y="253.98">Roughly right every day</tspan><tspan x="96" y="340.22" fill="#6e6e73">beats perfectly right</tspan><tspan x="96" y="426.46" fill="#6e6e73">for a week.</tspan></text><g id="chart-card"><rect x="96" y="476.46" width="888" height="770" rx="40" fill="#fff"/><text id="example" fill="#a1a1a6" font-family="Inter" font-size="22" font-weight="400" xml:space="preserve"><tspan x="130" y="530.46">An example: four weeks on a 2,200 kcal goal</tspan></text><g id="roughly-right"><text fill="#0a0a0a" font-family="Inter Tight" font-size="34" font-weight="600" letter-spacing="-0.03em" xml:space="preserve"><tspan x="130" y="584.46">Roughly right, every day</tspan></text><text fill="#6e6e73" font-family="Inter" font-size="24" font-weight="400" xml:space="preserve"><tspan x="130" y="622.46">About 2,200, give or take. A few days over.</tspan></text><text id="rough-count" fill="#0a0a0a" font-family="Inter Tight" font-size="84" font-weight="600" letter-spacing="-0.04em" xml:space="preserve"><tspan x="854.35" y="608.46">25</tspan></text><text fill="#6e6e73" font-family="Inter" font-size="22" font-weight="400" xml:space="preserve"><tspan x="781.85" y="640.46">days within 10%</tspan></text><rect x="130" y="679.08" width="820" height="23.89" fill="#34c759" id="rough-band" fill-opacity="0.15"/><line id="rough-goal" x1="130" x2="950" y1="691.03" y2="691.03" stroke="#5aa9ff" stroke-width="2" stroke-dasharray="7 5"/><g id="rough-days"><path d="M130 810.46V697.74Q130 693.74 134 693.74H149.71Q153.71 693.74 153.71 697.74V810.46Z" fill="#34c759"/><path d="M157.71 810.46V689.6Q157.71 685.6 161.71 685.6H177.43Q181.43 685.6 181.43 689.6V810.46Z" fill="#34c759"/><pa