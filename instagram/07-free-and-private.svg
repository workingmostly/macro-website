<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
<title>Free forever. And you’re not the product.</title>
<rect id="background" width="1080" height="1350" fill="#dbecff"/><text id="eyebrow" fill="#007aff" font-family="Inter" font-size="26" font-weight="600" letter-spacing="0.14em" xml:space="preserve"><tspan x="96" y="150">PRIVACY</tspan></text><text id="headline" fill="#0a0a0a" font-family="Inter Tight" font-size="132" font-weight="600" letter-spacing="-0.04em" xml:space="preserve"><tspan x="96" y="309.96">Free forever.</tspan><tspan x="96" y="439.32">And you’re not</tspan><tspan x="96" y="568.68">the product.</tspan></text><g id="promises"><g id="no-ads"><rect x="96" y="678.68" width="434" height="120" rx="32" fill="#fff" fill-opacity="0.7"/><circle cx="154" cy="738.684" r="26" fill="#007aff"/><path d="M143.17 739.12l7.15 7.15L164.83 731.1" stroke="#fff" stroke-width="4.33" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text fill="#0a0a0a" font-family="Inter" font-size="40" font-weight="500" letter-spacing="-0.01em" xml:space="preserve"><tspan x="204" y="753.18">No ads</tspan></text></g><g id="no-trackers"><rect x="550" y="678.68" width="434" height="120" rx="32" fill="#fff" fill-opacity="0.7"/><circle cx="608" cy="738.684" r="26" fill="#007aff"/><path d="M597.17 739.12l7.15 7.15L618.83 731.1" stroke="#fff" stroke-width="4.33" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text fill="#0a0a0a" font-family="Inter" font-size="40" font-weight="500" letter-spacing="-0.01em" xml:space="preserve"><tspan x="658" y="753.18">No trackers</tspan></text></g><g id="no-account"><rect x="96" y="818.68" width="434" height="120" rx="32" fill="#fff" fill-opacity="0.7"/><circle cx="154" cy="878.684" r="26" fill="#007aff"/><path d="M143.17 879.12l7.15 7.15L164.83 871.1" stroke="#fff" stroke-width="4.33" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text fill="#0a0a0a" font-family="Inter" font-size="40" font-weight="500" letter-spacing="-0.01em" xml:space="preserve"><tspan x="204" y="893.18">No account</tspan></text></g><g id="no-server"><rect x="550" y="818.68" width="434" height="120" rx="32" fill="#fff" fill-opacity="0.7"/><circle cx="608" cy="878.684" r="26" fill="#007aff"/><path d="M597.17 879.12l7.15 7.15L618.83 871.1" stroke="#fff" stroke-width="4.33" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text fill="#0a0a0a" font-family="Inter" font-size="40" font-weight="500" letter-spacing="-0.01em" xml:space="preserve"><tspan x="658" y="893.18">No server</tspan></text></g></g><text id="body" fill="#56606b" font-family="Inter" font-size="38" font-weight="400" xml:space="preserve"><tspan x="96" y="1130.08">Your meals stay on your iPhone and</tspan><tspan x="96" y="1184.04">in your own private iCloud.</tspan><tspan x="96" y="1238">We couldn’t see them if we wanted to.</tspan></text>
</svg>
