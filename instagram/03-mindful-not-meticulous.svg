<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
<title>Mindful, not meticulous.</title>
<rect id="background" width="1080" height="1350" fill="#ffefd9"/><text id="eyebrow" fill="#ff9500" font-family="Inter" font-size="26" font-weight="600" letter-spacing="0.14em" xml:space="preserve"><tspan x="96" y="150">MINDFUL, NOT METICULOUS</tspan></text><text id="body" fill="#5c5753" font-family="Inter" font-size="38" font-weight="400" xml:space="preserve"><tspan x="96" y="1022.16">Counting every calorie to the last digit is</tspan><tspan x="96" y="1076.12">stressful, and it’s easy for the numbers</tspan><tspan x="96" y="1130.08">to take over. A ballpark, logged every</tspan><tspan x="96" y="1184.04">day, is easier on your head. And it’s</tspan><tspan x="96" y="1238">what actually moves the needle.</tspan></text><text id="precise" fill="#0a0a0a" fill-opacity="0.22" font-family="Inter Tight" font-size="187" font-weight="600" letter-spacing="-0.04em" xml:space="preserve"><tspan x="96" y="544.94">612 kcal</tspan></text><rect x="77.3" y="480.43" width="658.71" height="16.83" rx="8.41" fill="#0a0a0a" id="strike" fill-opacity="0.22"/><text id="rough" fill="#0a0a0a" font-family="Inter Tight" font-size="187" font-weight="600" letter-spacing="-0.04em" xml:space="preserve"><tspan x="96" y="743.16">About 600.</tspan></text>
</svg>
